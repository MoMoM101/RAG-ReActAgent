name: Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  grounded-answer-release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Validate canonical grounded-answer evaluation
        run: >-
          python release_gate.py
          --report tests/grounded_answer_eval_final_full_rescored.json

  docker-e2e-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate sanitized local Docker E2E evidence
        run: >-
          python backend/release_evidence.py validate
          --evidence backend/tests/e2e/docker_e2e_release_evidence.json

  release-ready:
    if: github.ref_type == 'tag'
    needs:
      - grounded-answer-release-gate
      - docker-e2e-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all release evidence passed
        run: echo "Grounded-answer gate and source-bound Docker E2E evidence passed for $GITHUB_REF_NAME"
